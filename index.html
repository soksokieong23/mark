<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級日常表現與計分管理系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 20px;
        }
        .config-card {
            background: #e8f0fe;
            border: 1px solid #aecbfa;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }
        .config-card h3 {
            margin-top: 0;
            color: #174ea6;
        }
        .config-group {
            display: flex;
            gap: 10px;
        }
        input, button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        input[type="text"], input[type="url"] {
            flex: 1;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }
        button:hover { background-color: #1557b0; }
        button.add-btn { background-color: #34a853; }
        button.add-btn:hover { background-color: #2d8e47; }
        button.sync-btn { background-color: #fbbc04; color: #202124; }
        button.sync-btn:hover { background-color: #e3a600; }
        button.delete-btn { background-color: #ea4335; padding: 4px 8px; font-size: 12px; }
        button.delete-btn:hover { background-color: #c5221f; }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            align-items: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .table-responsive {
            overflow-x: auto;
            margin-top: 10px;
            max-height: 70vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 8px 6px;
            text-align: center;
            white-space: nowrap;
        }
        th {
            background-color: #f1f3f4;
            color: #3c4043;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .score-input {
            width: 55px;
            text-align: center;
            padding: 4px;
        }
        .total-cell {
            font-weight: bold;
            color: #1a73e8;
            background-color: #e8f0fe;
        }
        .rename-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .header-actions {
            display: flex;
            gap: 2px;
        }
        .header-actions button {
            padding: 2px 5px;
            font-size: 10px;
        }
        .status-msg {
            margin-top: 8px;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>學生課堂表現與日常計分系統</h1>

    <!-- Google Sheet 串接區 -->
    <div class="config-card">
        <h3>🔗 Google Sheet 同步設定</h3>
        <div class="config-group">
            <input type="url" id="scriptUrl" value="https://script.google.com/macros/s/AKfycbwQmr7uXzv98P1phZ-F6yqsyrq8XI1sMMOR3o4VFwQmQZWJHgz_DmxJhHBOPmT68q1P/exec" placeholder="請貼上 Google Apps Script Web App URL">
            <button class="sync-btn" onclick="uploadToGoogleSheet()">🚀 同步至 Google Sheet</button>
        </div>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <!-- 控制功能區 -->
    <div class="controls">
        <div class="control-group">
            <input type="text" id="newItemName" placeholder="新項目名稱 (如: 遲到)">
            <button class="add-btn" onclick="addColumn()">+ 新增項目欄位</button>
        </div>

        <div class="control-group" style="margin-left: auto;">
            <input type="text" id="newNo" placeholder="學號" style="width: 70px;">
            <input type="text" id="newName" placeholder="姓名" style="width: 100px;">
            <button class="add-btn" onclick="addRow()">+ 新增學生</button>
        </div>
    </div>

    <!-- 評分表格 -->
    <div class="table-responsive">
        <table id="scoreTable">
            <thead>
                <tr id="tableHeader">
                    <th>學號</th>
                    <th>姓名</th>
                    <!-- 動態評分項目欄位 -->
                    <th>總分</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 資料自動生成 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // 1. 初始化計分項目 (根據圖片包含回答問題 + A~F + a~e)
    let columns = [
        { id: 'q_ans', name: '回答問題' },
        { id: 'A', name: 'A 坐姿不端莊' },
        { id: 'B', name: 'B 做學習無關' },
        { id: 'C', name: 'C 打瞌睡' },
        { id: 'D', name: 'D 欠作業/欠交' },
        { id: 'E', name: 'E 聊天' },
        { id: 'F', name: 'F 桌面不整齊' },
        { id: 'a', name: 'a 積極討論' },
        { id: 'b', name: 'b 帶領討論' },
        { id: 'c', name: 'c 整理知識' },
        { id: 'd', name: 'd 分享交流' },
        { id: 'e', name: 'e 認真做操' }
    ];

    // 2. 初始化圖片中的 33 位學生資料
    const rawStudentList = [
        "甘敏儀", "何語嫣", "余沁妍", "吳羽珮", "吳曉霞", 
        "呂紫瑜", "李曉詠", "林心怡", "林沈妍", "林梓晴", 
        "林靜", "徐銘膽", "馬卓淇", "張頌怡", "梁相晴", 
        "莫凱淇", "許心怡", "許思語", "郭詩蒸", "陳月潼", 
        "馮芷晴", "黃佩琳", "楊依", "葉子翹", "霍穎殷", 
        "歐緻園", "蔣伊喬", "蔣尉琳", "盧芷晴", "鄭雪嵐", 
        "羅穎詩", "關凱琳", "江尚葇"
    ];

    let rowsData = rawStudentList.map((name, index) => {
        let noStr = (index + 1 < 10 ? '0' : '') + (index + 1);
        let defaultScores = {};
        columns.forEach(col => defaultScores[col.id] = 0);
        return {
            id: Date.now() + index,
            no: noStr,
            name: name,
            scores: defaultScores
        };
    });

    let colCounter = 1;

    window.onload = function() {
        renderTable();
    };

    // 渲染表格
    function renderTable() {
        const headerTr = document.getElementById('tableHeader');
        const body = document.getElementById('tableBody');

        headerTr.innerHTML = `
            <th>學號</th>
            <th>姓名</th>
        `;

        // 渲染欄位表頭
        columns.forEach(col => {
            const th = document.createElement('th');
            th.innerHTML = `
                <div class="rename-header">
                    <span>${col.name}</span>
                    <div class="header-actions">
                        <button onclick="enableRename('${col.id}')" title="修改名稱">✏️</button>
                        <button class="delete-btn" onclick="deleteColumn('${col.id}')" title="刪除欄位">✕</button>
                    </div>
                </div>
            `;
            headerTr.appendChild(th);
        });

        headerTr.innerHTML += `
            <th>總分</th>
            <th>操作</th>
        `;

        // 渲染學生資料列
        body.innerHTML = '';
        rowsData.forEach((row, rowIndex) => {
            const tr = document.createElement('tr');

            let total = 0;
            columns.forEach(col => {
                total += parseFloat(row.scores[col.id]) || 0;
            });

            let rowHtml = `
                <td><input type="text" value="${row.no}" onchange="updateRowInfo(${rowIndex}, 'no', this.value)" style="width:50px; text-align:center;"></td>
                <td><input type="text" value="${row.name}" onchange="updateRowInfo(${rowIndex}, 'name', this.value)" style="width:90px; text-align:center;"></td>
            `;

            columns.forEach(col => {
                const scoreVal = row.scores[col.id] !== undefined ? row.scores[col.id] : 0;
                rowHtml += `
                    <td>
                        <input type="number" class="score-input" value="${scoreVal}" 
                               oninput="updateScore(${rowIndex}, '${col.id}', this.value)">
                    </td>
                `;
            });

            rowHtml += `
                <td class="total-cell" id="total-${rowIndex}">${total}</td>
                <td><button class="delete-btn" onclick="deleteRow(${rowIndex})">刪除</button></td>
            `;

            tr.innerHTML = rowHtml;
            body.appendChild(tr);
        });
    }

    // 新增自訂欄位
    function addColumn() {
        const input = document.getElementById('newItemName');
        const colName = input.value.trim();
        if (!colName) {
            alert('請輸入項目名稱！');
            return;
        }

        const newColId = 'custom_' + colCounter++;
        columns.push({ id: newColId, name: colName });

        rowsData.forEach(row => {
            row.scores[newColId] = 0;
        });

        input.value = '';
        renderTable();
    }

    // 重命名欄位
    function enableRename(colId) {
        const col = columns.find(c => c.id === colId);
        if (!col) return;

        const newName = prompt('請輸入新的欄位名稱：', col.name);
        if (newName !== null && newName.trim() !== '') {
            col.name = newName.trim();
            renderTable();
        }
    }

    // 刪除欄位
    function deleteColumn(colId) {
        if (confirm('確定要刪除這個項目欄位嗎？相關數據將會被清除。')) {
            columns = columns.filter(c => c.id !== colId);
            rowsData.forEach(row => delete row.scores[colId]);
            renderTable();
        }
    }

    // 新增學生
    function addRow() {
        const no = document.getElementById('newNo').value.trim() || '00';
        const name = document.getElementById('newName').value.trim() || '未命名';

        const newScores = {};
        columns.forEach(col => newScores[col.id] = 0);

        rowsData.push({
            id: Date.now(),
            no: no,
            name: name,
            scores: newScores
        });

        document.getElementById('newNo').value = '';
        document.getElementById('newName').value = '';

        renderTable();
    }

    // 更新分數與總分
    function updateScore(rowIndex, colId, value) {
        const numVal = parseFloat(value) || 0;
        rowsData[rowIndex].scores[colId] = numVal;

        let total = 0;
        columns.forEach(col => {
            total += (parseFloat(rowsData[rowIndex].scores[col.id]) || 0);
        });

        document.getElementById(`total-${rowIndex}`).innerText = total;
    }

    function updateRowInfo(rowIndex, field, value) {
        rowsData[rowIndex][field] = value;
    }

    function deleteRow(rowIndex) {
        if (confirm('確定要刪除這位學生？')) {
            rowsData.splice(rowIndex, 1);
            renderTable();
        }
    }

    // 同步上傳至 Google Sheet
    function uploadToGoogleSheet() {
        const url = document.getElementById('scriptUrl').value.trim();
        const statusMsg = document.getElementById('statusMsg');

        if (!url) {
            alert('請輸入有效的 Google Apps Script 網址！');
            return;
        }

        statusMsg.style.color = '#1a73e8';
        statusMsg.innerText = '⏳ 正在上傳資料至 Google Sheet...';

        const header = ['學號', '姓名', ...columns.map(c => c.name), '總分'];
        const rows = rowsData.map(row => {
            let total = 0;
            const scoreArr = columns.map(c => {
                const s = parseFloat(row.scores[c.id]) || 0;
                total += s;
                return s;
            });
            return [row.no, row.name, ...scoreArr, total];
        });

        const payload = { header: header, rows: rows };

        fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusMsg.style.color = '#34a853';
            statusMsg.innerText = '✅ 資料已傳送至 Google Sheet！請至您的 Google 試算表確認結果。';
        })
        .catch(err => {
            statusMsg.style.color = '#ea4335';
            statusMsg.innerText = '❌ 發送失敗，請檢查網路連線或 Apps Script 部署設定。';
            console.error(err);
        });
    }
</script>

</body>
</html>
