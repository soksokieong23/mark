<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>點擊加分與自動上傳系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #1a73e8;
            margin: 0 0 15px 0;
            font-size: 22px;
        }
        .config-card {
            background: #e8f0fe;
            border: 1px solid #aecbfa;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .config-card input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .sync-status {
            font-size: 13px;
            font-weight: bold;
            min-width: 140px;
            text-align: right;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            background: #fafafa;
            padding: 10px;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        input, button {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #1557b0; }
        button.add-btn { background-color: #34a853; }
        button.delete-btn { background-color: #ea4335; padding: 2px 6px; font-size: 11px; }

        .table-responsive {
            overflow: auto;
            max-height: 75vh;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 6px 4px;
            text-align: center;
        }
        th {
            background-color: #f1f3f4;
            position: sticky;
            top: 0;
            z-index: 10;
            font-size: 13px;
        }
        
        /* 點擊加減分按鈕樣式 */
        .score-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn-btn {
            width: 26px;
            height: 26px;
            padding: 0;
            line-height: 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-plus { background-color: #34a853; color: white; }
        .btn-plus:hover { background-color: #2d8e47; }
        .btn-minus { background-color: #ea4335; color: white; }
        .btn-minus:hover { background-color: #c5221f; }
        .score-val {
            display: inline-block;
            width: 28px;
            font-weight: bold;
            font-size: 14px;
        }
        .total-cell {
            font-weight: bold;
            color: #1a73e8;
            background-color: #e8f0fe;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>學生課堂點擊加分與自動同步系統</h1>

    <!-- Google Sheet 網址設定與狀態顯示 -->
    <div class="config-card">
        <label style="font-weight:bold; font-size:13px;">🔗 Apps Script URL:</label>
        <input type="url" id="scriptUrl" value="https://script.google.com/macros/s/AKfycbwQmr7uXzv98P1phZ-F6yqsyrq8XI1sMMOR3o4VFwQmQZWJHgz_DmxJhHBOPmT68q1P/exec">
        <div id="statusMsg" class="sync-status" style="color: #34a853;">🟢 就緒（微調分數即自動同步）</div>
    </div>

    <!-- 管理按鈕區 -->
    <div class="controls">
        <div class="control-group">
            <input type="text" id="newItemName" placeholder="新項目 (如: 遲到)" style="width: 120px;">
            <button class="add-btn" onclick="addColumn()">+ 加項目欄位</button>
        </div>

        <div class="control-group" style="margin-left: auto;">
            <input type="text" id="newNo" placeholder="學號" style="width: 50px;">
            <input type="text" id="newName" placeholder="姓名" style="width: 80px;">
            <button class="add-btn" onclick="addRow()">+ 加學生</button>
        </div>
    </div>

    <!-- 計分表格 -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr id="tableHeader">
                    <th>學號</th>
                    <th>姓名</th>
                    <!-- 動態欄位 -->
                    <th>總分</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 資料區 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // 預設項目欄位
    let columns = [
        { id: 'q_ans', name: '回答問題' },
        { id: 'A', name: 'A 坐姿不端莊' },
        { id: 'B', name: 'B 做學習無關' },
        { id: 'C', name: 'C 打瞌睡' },
        { id: 'D', name: 'D 欠作業' },
        { id: 'E', name: 'E 聊天' },
        { id: 'F', name: 'F 桌面不整' },
        { id: 'a', name: 'a 積極討論' },
        { id: 'b', name: 'b 帶領討論' },
        { id: 'c', name: 'c 整理知識' },
        { id: 'd', name: 'd 分享交流' },
        { id: 'e', name: 'e 認真做操' }
    ];

    // 預設 33 位學生名單
    const rawStudentList = [
        "甘敏儀", "何語嫣", "余沁妍", "吳羽珮", "吳曉霞", 
        "呂紫瑜", "李曉詠", "林心怡", "林沈妍", "林梓晴", 
        "林靜", "徐銘膽", "馬卓淇", "張頌怡", "梁相晴", 
        "莫凱淇", "許心怡", "許思語", "郭詩蒸", "陳月潼", 
        "馮芷晴", "黃佩琳", "楊依", "葉子翹", "霍穎殷", 
        "歐緻園", "蔣伊喬", "蔣尉琳", "盧芷晴", "鄭雪嵐", 
        "羅穎詩", "關凱琳", "江尚葇"
    ];

    let rowsData = rawStudentList.map((name, index) => {
        let noStr = (index + 1 < 10 ? '0' : '') + (index + 1);
        let defaultScores = {};
        columns.forEach(col => defaultScores[col.id] = 0);
        return {
            id: Date.now() + index,
            no: noStr,
            name: name,
            scores: defaultScores
        };
    });

    let colCounter = 1;
    let autoSyncTimer = null; // 自動同步節流定時器

    window.onload = function() {
        renderTable();
    };

    // 渲染表格
    function renderTable() {
        const headerTr = document.getElementById('tableHeader');
        const body = document.getElementById('tableBody');

        headerTr.innerHTML = `<th>學號</th><th>姓名</th>`;

        columns.forEach(col => {
            const th = document.createElement('th');
            th.innerHTML = `
                <div>
                    ${col.name}<br>
                    <button onclick="enableRename('${col.id}')" style="padding:1px 4px; font-size:10px;">✏️改名</button>
                    <button class="delete-btn" onclick="deleteColumn('${col.id}')">✕</button>
                </div>
            `;
            headerTr.appendChild(th);
        });

        headerTr.innerHTML += `<th>總分</th><th>操作</th>`;

        body.innerHTML = '';
        rowsData.forEach((row, rowIndex) => {
            const tr = document.createElement('tr');

            let total = 0;
            columns.forEach(col => total += parseFloat(row.scores[col.id]) || 0);

            let rowHtml = `
                <td><input type="text" value="${row.no}" onchange="updateRowInfo(${rowIndex}, 'no', this.value)" style="width:40px; text-align:center;"></td>
                <td><input type="text" value="${row.name}" onchange="updateRowInfo(${rowIndex}, 'name', this.value)" style="width:75px; text-align:center;"></td>
            `;

            // 點擊 +1 / -1 按鈕設計
            columns.forEach(col => {
                const scoreVal = row.scores[col.id] || 0;
                rowHtml += `
                    <td>
                        <div class="score-box">
                            <button class="btn-btn btn-minus" onclick="changeScore(${rowIndex}, '${col.id}', -1)">-</button>
                            <span class="score-val" id="val-${rowIndex}-${col.id}">${scoreVal}</span>
                            <button class="btn-btn btn-plus" onclick="changeScore(${rowIndex}, '${col.id}', 1)">+</button>
                        </div>
                    </td>
                `;
            });

            rowHtml += `
                <td class="total-cell" id="total-${rowIndex}">${total}</td>
                <td><button class="delete-btn" onclick="deleteRow(${rowIndex})">刪除</button></td>
            `;

            tr.innerHTML = rowHtml;
            body.appendChild(tr);
        });
    }

    // 點擊增加或減少分數（並觸發自動同步）
    function changeScore(rowIndex, colId, delta) {
        rowsData[rowIndex].scores[colId] = (rowsData[rowIndex].scores[colId] || 0) + delta;
        
        // 更新當前格子的數字
        document.getElementById(`val-${rowIndex}-${colId}`).innerText = rowsData[rowIndex].scores[colId];

        // 更新總分
        let total = 0;
        columns.forEach(col => total += (parseFloat(rowsData[rowIndex].scores[col.id]) || 0));
        document.getElementById(`total-${rowIndex}`).innerText = total;

        // 觸發秒同步到 Google Sheet
        triggerAutoSync();
    }

    // 新增欄位
    function addColumn() {
        const input = document.getElementById('newItemName');
        const colName = input.value.trim();
        if (!colName) return alert('請輸入名稱');

        const newColId = 'custom_' + colCounter++;
        columns.push({ id: newColId, name: colName });
        rowsData.forEach(row => row.scores[newColId] = 0);

        input.value = '';
        renderTable();
        triggerAutoSync();
    }

    // 重命名欄位
    function enableRename(colId) {
        const col = columns.find(c => c.id === colId);
        if (!col) return;
        const newName = prompt('請輸入新項目名稱：', col.name);
        if (newName && newName.trim()) {
            col.name = newName.trim();
            renderTable();
            triggerAutoSync();
        }
    }

    // 刪除欄位
    function deleteColumn(colId) {
        if (confirm('確定刪除此欄位？')) {
            columns = columns.filter(c => c.id !== colId);
            rowsData.forEach(row => delete row.scores[colId]);
            renderTable();
            triggerAutoSync();
        }
    }

    // 新增學生
    function addRow() {
        const no = document.getElementById('newNo').value.trim() || '00';
        const name = document.getElementById('newName').value.trim() || '新學生';

        const newScores = {};
        columns.forEach(col => newScores[col.id] = 0);

        rowsData.push({ id: Date.now(), no: no, name: name, scores: newScores });

        document.getElementById('newNo').value = '';
        document.getElementById('newName').value = '';

        renderTable();
        triggerAutoSync();
    }

    function updateRowInfo(rowIndex, field, value) {
        rowsData[rowIndex][field] = value;
        triggerAutoSync();
    }

    function deleteRow(rowIndex) {
        if (confirm('確定刪除該學生？')) {
            rowsData.splice(rowIndex, 1);
            renderTable();
            triggerAutoSync();
        }
    }

    // 自動同步機制 (防止太頻繁請求，點擊後 0.8 秒無連續點擊即發送)
    function triggerAutoSync() {
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.style.color = '#fbbc04';
        statusMsg.innerText = '🟡 變更中...準備同步';

        clearTimeout(autoSyncTimer);
        autoSyncTimer = setTimeout(() => {
            uploadToGoogleSheet();
        }, 800);
    }

    // 發送至 Google Sheet
    function uploadToGoogleSheet() {
        const url = document.getElementById('scriptUrl').value.trim();
        const statusMsg = document.getElementById('statusMsg');

        if (!url) {
            statusMsg.style.color = '#ea4335';
            statusMsg.innerText = '❌ 未設定 Web App URL';
            return;
        }

        statusMsg.style.color = '#1a73e8';
        statusMsg.innerText = '⏳ 自動同步中...';

        const header = ['學號', '姓名', ...columns.map(c => c.name), '總分'];
        const rows = rowsData.map(row => {
            let total = 0;
            const scoreArr = columns.map(c => {
                const s = parseFloat(row.scores[c.id]) || 0;
                total += s;
                return s;
            });
            return [row.no, row.name, ...scoreArr, total];
        });

        fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ header: header, rows: rows })
        })
        .then(() => {
            statusMsg.style.color = '#34a853';
            statusMsg.innerText = '🟢 已自動同步至 Google Sheet！';
        })
        .catch(err => {
            statusMsg.style.color = '#ea4335';
            statusMsg.innerText = '❌ 同步失敗';
            console.error(err);
        });
    }
</script>

</body>
</html>
